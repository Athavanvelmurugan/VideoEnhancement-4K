<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="50%" stop-color="#181335"/>
      <stop offset="100%" stop-color="#2a124d"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#tGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Glowing Emblem / "T" for Thamizh -->
  <g filter="url(#glow)">
    <!-- Horizontal Top Bar of T -->
    <path d="M 120 140 C 120 125, 135 120, 150 120 L 362 120 C 377 120, 392 125, 392 140 C 392 155, 377 160, 362 160 L 286 160 L 286 370 C 286 385, 275 395, 256 395 C 237 395, 226 385, 226 370 L 226 160 L 150 160 C 135 160, 120 155, 120 140 Z" fill="url(#tGrad)"/>

    <!-- Sparkle Stars -->
    <path d="M 370 210 Q 370 235 395 235 Q 370 235 370 260 Q 370 235 345 235 Q 370 235 370 210 Z" fill="url(#goldGrad)"/>
    <path d="M 140 330 Q 140 348 158 348 Q 140 348 140 366 Q 140 348 122 348 Q 140 348 140 330 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
