name: Build Android Hybrid APK in Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build trigger from GitHub Actions UI

jobs:
  build:
    name: Build Remaster Enhancement APK (0 Local Storage/RAM)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM & Capacitor Dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share

      - name: Build Web Production Bundle
        run: |
          npm run build

      - name: Add & Sync Android Native Platform
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remaster-Enhancement-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage Release APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Remaster-Enhancement.apk

      - name: Publish Public GitHub Release (Automatic Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Remaster Enhancement Latest APK
          body: |
            ## 🚀 Remaster Enhancement Automatic Cloud Build
            - Direct public APK download for Android phones.
            - Auto-detected and downloaded directly inside the app.
          files: Remaster-Enhancement.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
