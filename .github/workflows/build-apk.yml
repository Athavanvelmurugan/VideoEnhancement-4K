name: Build Android Hybrid APK in Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build trigger from GitHub Actions UI

jobs:
  build:
    name: Build Remaster Enhancement APK (0 Local Storage/RAM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Capacitor Dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Production Bundle
        run: |
          npm run build

      - name: Add & Sync Android Native Platform
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remaster-Enhancement-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
